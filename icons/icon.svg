    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c2"/><stop offset="1" stop-color="#fff6c2" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#sky)" stroke="#2b1d0e" stroke-width="14"/>
  <g transform="translate(256 256) scale(1.0) translate(-256 -256)">
    <circle cx="256" cy="200" r="190" fill="url(#sun)"/>

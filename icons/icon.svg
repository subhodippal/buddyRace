      <line x1="40" y1="170" x2="108" y2="170"/><line x1="24" y1="222" x2="104" y2="222"/><line x1="46" y1="274" x2="112" y2="274"/>
    </g>
    <!-- shirt -->
    <path d="M150 400 Q160 318 256 312 Q352 318 362 400 Z" fill="#ff5533" stroke="#2b1d0e" stroke-width="12" stroke-linejoin="round"/>

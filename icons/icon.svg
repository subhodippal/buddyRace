    <text x="420" y="168" font-family="Noto Sans Bengali" font-weight="800" font-size="40" fill="#fff" stroke="#2b1d0e" stroke-width="3" text-anchor="middle" transform="rotate(12 420 168)">ধর!</text>
    
    <g transform="translate(256 420)">
      <path d="M-190 -42 L190 -42 L205 0 L190 42 L-190 42 L-205 0 Z" fill="#2b1d0e"/>
      <text x="0" y="17" text-anchor="middle" font-family="Noto Sans Bengali" font-weight="800" font-size="62" fill="#fff8e6" stroke="#2b1d0e" stroke-width="2">বাডি রেস</text>
    </g>

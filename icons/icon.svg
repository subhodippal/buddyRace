    <path d="M190 182 L238 200" stroke="#2b1d0e" stroke-width="13" stroke-linecap="round"/>
    <path d="M322 182 L274 200" stroke="#2b1d0e" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="214" cy="222" rx="20" ry="22" fill="#fff" stroke="#2b1d0e" stroke-width="6"/><circle cx="220" cy="226" r="9" fill="#2b1d0e"/>
    <ellipse cx="298" cy="222" rx="20" ry="22" fill="#fff" stroke="#2b1d0e" stroke-width="6"/><circle cx="292" cy="226" r="9" fill="#2b1d0e"/>
    <!-- shouting mouth -->
    <path d="M222 268 Q256 250 290 268 Q286 312 256 314 Q226 312 222 268 Z" fill="#7a1f12" stroke="#2b1d0e" stroke-width="8" stroke-linejoin="round"/>
    <path d="M236 296 Q256 284 276 296 Q266 308 256 308 Q246 308 236 296 Z" fill="#ff7b7b"/>
    <!-- fist -->
    <g transform="translate(392 258) rotate(-14)">
      <rect x="-46" y="-40" width="92" height="80" rx="30" fill="#c68642" stroke="#2b1d0e" stroke-width="11"/>
